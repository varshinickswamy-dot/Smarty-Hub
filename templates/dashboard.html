<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#020617,#0f172a);
    color:white;
    min-height:100vh;
}

/* NAVBAR */
nav{
    background:#020617;
}

/* GRID LAYOUT */
.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));
    gap:clamp(18px,3vw,35px);
    margin-top:40px;
}

/* CARD BOX */
.card-box{
    background:#0f172a;
    min-height:200px;
    border-radius:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:22px;
    font-weight:600;
    color:white;
    transition:0.3s ease;
    box-shadow:0 0 25px rgba(56,189,248,0.6);
    overflow-wrap:anywhere;
}

@media (hover:hover) and (pointer:fine){
    .card-box:hover{
        transform:translateY(-10px) scale(1.02);
        box-shadow:0 0 45px rgba(56,189,248,1);
        background:#020617;
    }
}

.dashboard-grid a:focus-visible .card-box{
    outline:3px solid #38bdf8;
    outline-offset:4px;
}

/* ICON */
.icon{
    font-size:50px;
    margin-bottom:12px;
}

/* LINK RESET */
a{
    text-decoration:none;
}

/* MOBILE HEADER + DASHBOARD SAFETY */
.navbar{
    position:relative;
    z-index:20;
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:72px;
    padding-top:max(.5rem, env(safe-area-inset-top)) !important;
    padding-bottom:.5rem !important;
}
.navbar-brand{
    min-width:0;
    margin-right:0 !important;
    font-size:clamp(1.15rem,4.8vw,1.5rem) !important;
    line-height:1.15;
    white-space:nowrap;
}
.navbar .btn{
    flex:0 0 auto;
    min-height:44px;
    padding:.55rem .9rem;
    font-size:clamp(.9rem,3.6vw,1rem);
    line-height:1.2;
}
.container{
    width:100%;
    min-width:0;
}
.dashboard-grid > a{
    display:block;
    min-width:0;
    width:100%;
}
.dashboard-grid .card-box{
    width:100%;
    min-width:0;
    overflow:hidden;
}
@media (max-width: 575px){
    .navbar{
        padding-left:12px !important;
        padding-right:12px !important;
        gap:8px;
    }
    .navbar-brand{
        font-size:1.15rem !important;
        letter-spacing:-.04em;
    }
    .navbar .btn{
        padding:.5rem .7rem;
        font-size:.9rem;
    }
    .container{
        padding-left:14px !important;
        padding-right:14px !important;
    }
    .container > h2{
        margin-top:1.25rem !important;
        margin-bottom:1rem;
        font-size:clamp(1.35rem,6vw,1.8rem);
        line-height:1.2;
        overflow-wrap:anywhere;
    }
    .dashboard-grid{
        margin-top:18px !important;
        grid-template-columns:minmax(0,1fr);
        gap:16px;
    }
    .card-box{
        min-height:140px !important;
        padding:22px 16px !important;
        font-size:clamp(1.05rem,4.5vw,1.3rem) !important;
    }
    .card-box .icon{
        font-size:42px;
        margin-bottom:8px;
    }
    .card-box small{
        font-size:.9rem;
        line-height:1.35;
    }
}
@media (max-width: 360px){
    .navbar-brand{font-size:1rem !important}
    .navbar .btn{padding:.45rem .55rem;font-size:.85rem}
}

@media (max-width: 575px){
    .dashboard-grid{
        grid-template-columns:minmax(0,1fr);
        gap:18px;
    }
    .card-box{
        min-height:150px;
        padding:20px;
    }
}

</style>
</head>

<body>

<nav class="navbar navbar-dark px-3 px-sm-4">
<span class="navbar-brand fs-4">✦ Smarty Hub</span>
<a href="/logout" class="btn btn-danger">Logout</a>
</nav>

<div class="container">

<h2 class="mt-4">Welcome {{current_user.name}}</h2>

<div class="dashboard-grid">

<a href="/career">
<div class="card-box">
<div class="icon">🎯</div>
Career Explorer
</div>
</a>

<a href="/launchpad">
<div class="card-box">
<div class="icon">🚀</div>
LaunchPad Studio
<small class="d-block mt-2">Turn skills into project proof</small>
</div>
</a>
<a href="/career-lab">
<div class="card-box">
<div class="icon">🧭</div>
Career Lab
<small class="d-block mt-2">Resume check & interview practice</small>
</div>
</a>

<a href="/chatbot">
<div class="card-box">
<div class="icon">🤖</div>
AI Counselor
</div>
</a>

<a href="/resume">
<div class="card-box">
<div class="icon">📄</div>
Resume Builder
</div>
</a>

<a href="/timetable">
<div class="card-box">
<div class="icon">⏱</div>
Study Timer
</div>
</a>

<a href="/admin">
<div class="card-box">
<div class="icon">🛠</div>
Admin Panel
</div>
</a>

</div>

</div>

</body>
</html>
