<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">

<style>
/* ================= GLOBAL ================= */
body{
    background:linear-gradient(135deg,#020617,#0f172a);
    color:#ffffff;
    min-height:100vh;
}
.card{
    background:#020617;
    padding:clamp(18px,5vw,50px);
    border-radius:24px;
    box-shadow:0 0 45px rgba(56,189,248,0.9);
}
h2{
    color:#38bdf8;
    font-weight:800;
}
label{
    color:#e0f2fe;
    font-weight:600;
}
input, textarea{
    background:#020617 !important;
    color:#ffffff !important;
    border:2px solid #38bdf8 !important;
    padding:14px;
    border-radius:12px;
}
#preview{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #38bdf8;
    display:none;
}
.profile-photo{
    width:120px;
    height:120px;
    object-fit:cover;
}
.download-help{
    display:block;
    color:#cbd5f5;
    line-height:1.5;
}
.counter{
    text-align:right;
    font-size:12px;
    color:#7dd3fc;
}
button{
    background:#22c55e;
    border:none;
    padding:15px;
    font-size:18px;
    font-weight:700;
    border-radius:12px;
    color:white;
}
button:hover{
    background:#16a34a;
}
.generate-btn{
    display:block;
    width:100%;
    min-height:56px;
    position:relative;
    z-index:2;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-appearance:none;
    appearance:none;
}
.generate-btn:disabled{
    opacity:.75;
    cursor:wait;
}
.back-btn{
    border:2px solid #38bdf8;
    color:#38bdf8;
}
.back-btn:hover{
    background:#38bdf8;
    color:black;
}
@media (max-width: 575px){
    .d-flex.justify-content-between{
        gap:12px;
        align-items:flex-start !important;
        flex-wrap:wrap;
    }
    h2{font-size:1.4rem;}
}
</style>
</head>

<body>

<div class="container mt-5 mb-5">
<div class="card">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📄 Resume Builder</h2>
    <a href="/dashboard" class="btn back-btn">⬅ Back</a>
</div>

<!-- 🔥 FIXED FORM -->
<form id="resumeForm" method="POST" action="{{ url_for('resume') }}" enctype="multipart/form-data">

<label for="photo">Profile Photo (optional)</label>
<img id="preview" class="profile-photo" alt="Selected profile photo">
<input id="photo" type="file" name="photo" class="form-control mb-4"
accept="image/jpeg,image/png" onchange="previewImage(event)">

<label for="resume-name">Full Name</label>
<input id="resume-name" name="name" autocomplete="name" class="form-control mb-3" required>

<label for="resume-email">Email</label>
<input id="resume-email" name="email" type="email" autocomplete="email" class="form-control mb-3" required>

<label for="resume-phone">Phone</label>
<input id="resume-phone" name="phone" type="tel" autocomplete="tel" class="form-control mb-3">

<label for="resume-address">Address</label>
<input id="resume-address" name="address" class="form-control mb-4">

<label for="resume-links">LinkedIn / GitHub</label>
<input id="resume-links" name="links" class="form-control mb-4">

<label for="resume-summary">Career Objective</label>
<textarea id="resume-summary" name="summary" class="form-control" maxlength="300"></textarea>
<div class="counter" id="sumCount">0 / 300</div>

<label for="resume-skills">Skills</label>
<textarea id="resume-skills" name="skills" class="form-control" maxlength="250"></textarea>
<div class="counter" id="skillsCount">0 / 250</div>

<label for="resume-education">Education</label>
<textarea id="resume-education" name="education" class="form-control" maxlength="250"></textarea>
<div class="counter" id="eduCount">0 / 250</div>

<label for="resume-experience">Experience</label>
<textarea id="resume-experience" name="experience" class="form-control" maxlength="250"></textarea>
<div class="counter" id="expCount">0 / 250</div>

<label for="resume-projects">Projects</label>
<textarea id="resume-projects" name="projects" class="form-control" maxlength="250"></textarea>
<div class="counter" id="projCount">0 / 250</div>

<label for="resume-certifications">Certifications</label>
<textarea id="resume-certifications" name="certifications" class="form-control" maxlength="200"></textarea>
<div class="counter" id="certCount">0 / 200</div>

<label for="resume-achievements">Achievements</label>
<textarea id="resume-achievements" name="achievements" class="form-control" maxlength="200"></textarea>
<div class="counter" id="achCount">0 / 200</div>

<label for="resume-languages">Languages</label>
<input id="resume-languages" name="languages" class="form-control mb-4">

<label for="resume-hobbies">Hobbies</label>
<input id="resume-hobbies" name="hobbies" class="form-control mb-4">

<!-- 🔥 FIXED BUTTON -->
<button id="generateResumeBtn" type="submit" class="generate-btn w-100">Generate Resume PDF</button>
<p id="resumeDownloadStatus" class="download-help mt-3" role="status" aria-live="polite">Your PDF will be downloaded to your phone when generation finishes.</p>

</form>

</div>
</div>

<script>
let previewUrl;
function previewImage(event){
    const file=event.target.files[0];
    if(!file) return;
    const img=document.getElementById("preview");
    if(previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl=URL.createObjectURL(file);
    img.src=previewUrl;
    img.style.display="block";
}

function countText(name,id){
    const f=document.querySelector(`textarea[name='${name}']`);
    const c=document.getElementById(id);
    f.addEventListener("input",()=>{c.innerText=f.value.length+" / "+f.maxLength});
}

countText("summary","sumCount");
countText("skills","skillsCount");
countText("education","eduCount");
countText("experience","expCount");
countText("projects","projCount");
countText("certifications","certCount");
countText("achievements","achCount");

/*
 * Use normal form navigation. The server redirects to a dedicated GET
 * attachment URL that Android WebView's native DownloadManager can handle.
 */
const resumeForm = document.getElementById("resumeForm");
const generateButton = document.getElementById("generateResumeBtn");
const downloadStatus = document.getElementById("resumeDownloadStatus");

resumeForm.addEventListener("submit", function(event) {
    if (!resumeForm.checkValidity()) {
        event.preventDefault();
        resumeForm.reportValidity();
        return;
    }

    if (generateButton.disabled) {
        event.preventDefault();
        return;
    }

    generateButton.disabled = true;
    generateButton.setAttribute("aria-busy", "true");
    generateButton.textContent = "Generating PDF…";
    downloadStatus.textContent = "Please wait. Creating your resume PDF…";

    // Some WebViews keep the page open after handing the attachment to
    // Android DownloadManager. Restore the button so another resume can be made.
    window.setTimeout(resetResumeButton, 15000);
});

function resetResumeButton() {
    generateButton.disabled = false;
    generateButton.removeAttribute("aria-busy");
    generateButton.textContent = "Generate Resume PDF";
}
document.addEventListener("visibilitychange", function() {
    if (!document.hidden) resetResumeButton();
});
window.addEventListener("focus", resetResumeButton);
</script>

</body>
</html>
