<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
<style>
body{
 background:linear-gradient(135deg,#0f172a,#1e293b);
 color:white;
 min-height:100vh;
 min-height:100svh;
}
main{
 min-height:100vh;
 min-height:100svh;
}
.card{
 background:#020617;
 padding:clamp(22px,5vw,30px);
 border-radius:15px;
 box-shadow:0 0 20px #38bdf8;
 width:min(100%,420px);
}
a{
 color:#38bdf8;
 text-decoration:none;
}
</style>
</head>
<body>

<main class="container d-flex justify-content-center align-items-center py-4">
<div class="card">

<h2 class="text-center mb-4">Student Guide Login</h2>

<!-- FLASH MESSAGE DISPLAY -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-danger">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}

<form method="POST">
<input name="email" type="email" autocomplete="email" class="form-control mb-3" placeholder="Email" aria-label="Email" required>
<input name="password" type="password" autocomplete="current-password" class="form-control mb-3" placeholder="Password" aria-label="Password" required>
<button class="btn btn-primary w-100">Login</button>
</form>

<p class="mt-3 text-center">
<a href="/register">Create Account</a>
</p>

</div>
</main>

</body>
</html>
