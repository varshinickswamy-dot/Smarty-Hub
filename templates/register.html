<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
<style>
body{
 background:linear-gradient(135deg,#0f172a,#1e293b);
 color:white;
 min-height:100vh;
 min-height:100svh;
}
main{
 min-height:100vh;
 min-height:100svh;
}
.card{
 background:#020617;
 padding:clamp(22px,5vw,30px);
 border-radius:15px;
 box-shadow:0 0 20px #22c55e;
 width:min(100%,420px);
}
</style>
</head>
<body>

<main class="container d-flex justify-content-center align-items-center py-4">
<div class="card">

<h2 class="text-center mb-4">Create Account</h2>

<form method="POST">
<input name="name" autocomplete="name" class="form-control mb-3" placeholder="Full Name" aria-label="Full name" required>
<input name="email" type="email" autocomplete="email" class="form-control mb-3" placeholder="Email" aria-label="Email" required>
<input name="password" type="password" autocomplete="new-password" class="form-control mb-3" placeholder="Password" aria-label="Password" required>
<button class="btn btn-success w-100">Register</button>
</form>

<p class="mt-3 text-center">
<a href="/">Already have account?</a>
</p>

</div>
</main>

</body>
</html>
